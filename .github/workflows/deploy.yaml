name: Build and Deploy to Cloudflare Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:
    schedule:
        # Rebuild latest docs daily shortly after midnight UTC.
        - cron: "15 0 * * *"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              with:
                  lfs: true

            - name: Set up PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: null

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Run linting
              run: pnpm run lint

            - name: Generate build
              run: pnpm run build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Deployed with a plain npx call rather than an action. cloudflare/pages-action
            # was retired and no longer resolves; running Wrangler from a scratch
            # directory keeps it off the repo's pnpm dependency tree.
            - name: Publish to Cloudflare Pages
              working-directory: ${{ runner.temp }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: >-
                  npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/out"
                  --project-name=docs
                  --branch=main
